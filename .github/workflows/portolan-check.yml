# Generated by Portolan. Preview changes in Settings before updating.
name: Portolan architecture check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portolan-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shortlink-org/portolan@0.2.2
        with:
          command: check
          version: 0.2.2
